<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shipping — SH Jewelry</title>
<meta name="description" content="SH Jewelry shipping information.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="assets/images/favicon-512.jpg">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<header id="site-header"></header>

<main id="main">
  <section class="section" style="padding-top:calc(var(--header-h) + 60px);">
    <div class="container-narrow">
      <div class="crumb"><a href="index.html">Home</a> / <span>Shipping</span></div>
      <h1>Shipping Information</h1>

      <div class="value-item reveal" style="margin-top:28px; border-color:var(--line-gold);" id="policyPlaceholderNote">
        <p style="color:var(--text-secondary); font-size:.9rem;">This page is a placeholder. Add your finalised courier, timelines, and cost details in Site Settings → Shipping Policy.</p>
      </div>

      <div class="reveal" id="policyBody" style="margin-top:40px;"></div>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>

  <!-- Firebase compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="assets/js/sanity.js"></script>
<script src="assets/js/settings.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/components.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", async () => {
    renderHeader("");
    renderFooter();
    initReveal();
    refreshBadges();
    await SETTINGS_READY;
    document.getElementById("policyBody").innerHTML = policyHtml(SETTINGS.shippingPolicy);
    if (SETTINGS.shippingPolicy !== SETTINGS_FALLBACK.shippingPolicy){
      document.getElementById("policyPlaceholderNote").style.display = "none";
    }
  });
</script>
</body>
</html>
