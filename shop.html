<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — SH Jewelry</title>
<meta name="description" content="Shop the full SH Jewelry collection — bracelets, earrings, necklaces and jhumka.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="assets/images/favicon-512.jpg">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<header id="site-header"></header>

<main id="main">
  <section class="page-banner with-image">
    <div class="pb-bg">
      <img src="assets/images/collection-emerald-hoops-1800.jpg" srcset="assets/images/collection-emerald-hoops-640.jpg 640w, assets/images/collection-emerald-hoops-1100.jpg 1100w, assets/images/collection-emerald-hoops-1800.jpg 1800w" sizes="100vw" alt="" loading="eager">
    </div>
    <div class="container pb-content">
      <div class="crumb"><a href="index.html">Home</a> / <span>Shop</span></div>
      <h1>Shop Jewelry</h1>
      <p class="lede" style="margin-top:14px;">Browse the full collection — bracelets, earrings, necklaces and jhumka.</p>
    </div>
  </section>

  <section class="section" style="padding-top:0;">
    <div class="container">
      <div class="shop-toolbar">
        <div class="search-field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="text" id="shopSearch" placeholder="Search products…" autocomplete="off">
        </div>
        <div class="chip-row" id="categoryChips"></div>
        <div class="sort-field">
          <select id="sortSelect">
            <option value="featured">Sort: Featured</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="name-asc">Name: A–Z</option>
          </select>
        </div>
      </div>

      <p class="text-secondary" id="resultsCount" style="margin-bottom:24px; font-size:.85rem;"></p>

      <div class="grid-3" id="shopGrid"></div>
      <div style="text-align:center; margin-top:44px;">
        <button class="btn btn-secondary" id="loadMoreBtn" style="display:none;">Load More</button>
      </div>
      <div class="results-empty" id="emptyState" style="display:none;">
        <h3>No pieces match your search</h3>
        <p>Try a different keyword or clear your filters.</p>
        <button class="btn btn-secondary" id="clearFilters" style="margin-top:20px;">Clear Filters</button>
      </div>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>

<script src="assets/js/sanity.js"></script>
<script src="assets/js/settings.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/shop.js"></script>
</body>
</html>
