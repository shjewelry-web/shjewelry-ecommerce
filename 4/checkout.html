<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — SH Jewelry</title>
<meta name="description" content="Complete your SH Jewelry order.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="assets/images/favicon-512.jpg">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<header id="site-header"></header>

<main id="main">
  <section class="section" style="padding-top:calc(var(--header-h) + 50px);">
    <div class="container">
      <div class="crumb"><a href="index.html">Home</a> / <a href="cart.html">Cart</a> / <span>Checkout</span></div>
      <h1 style="margin-bottom:40px;">Checkout</h1>

      <div id="checkoutContent"></div>

      <div class="empty-state" id="checkoutEmpty" style="display:none;">
        <h2>Your cart is empty</h2>
        <p class="text-secondary" style="margin-top:10px;">Add something to your cart before checking out.</p>
        <a href="shop.html" class="btn btn-primary" style="margin-top:26px;">Continue Shopping</a>
      </div>

      <div class="confirm-panel" id="confirmPanel" style="display:none;">
        <div class="confirm-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 12.5l5 5L19 7"/></svg>
        </div>
        <h2>Order Received</h2>
        <p class="text-secondary" style="margin-top:12px; max-width:44ch; margin-left:auto; margin-right:auto;">Thank you — we've received your order request and will be in touch to confirm details and delivery.</p>
        <a href="shop.html" class="btn btn-primary" style="margin-top:30px;">Continue Shopping</a>
      </div>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>

<script src="assets/js/sanity.js"></script>
<script src="assets/js/settings.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/checkout.js"></script>
</body>
</html>
