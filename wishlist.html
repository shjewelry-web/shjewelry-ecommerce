<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wishlist — SH Jewelry</title>
<meta name="description" content="Your saved pieces from SH Jewelry.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="assets/images/favicon-512.jpg">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<header id="site-header"></header>

<main id="main">
  <section class="section" style="padding-top:calc(var(--header-h) + 50px);">
    <div class="container">
      <div class="crumb"><a href="index.html">Home</a> / <span>Wishlist</span></div>
      <h1 style="margin-bottom:40px;">Your Wishlist</h1>

      <div class="grid-3" id="wishGrid"></div>

      <div class="empty-state" id="wishEmpty" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 21s-7.5-4.7-10-9.3C.4 8 2 4.5 5.6 4c2-.3 3.8.6 5 2.3C11.8 4.6 13.6 3.7 15.6 4 19.2 4.5 20.8 8 20 11.7 18.5 16.3 12 21 12 21z"/></svg>
        <h2>Your wishlist is empty</h2>
        <p class="text-secondary" style="margin-top:10px;">Tap the heart on any piece to save it here.</p>
        <a href="shop.html" class="btn btn-primary" style="margin-top:26px;">Browse Jewelry</a>
      </div>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>

  <!-- Firebase compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="assets/js/sanity.js"></script>
<script src="assets/js/settings.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/components.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", async () => {
    renderHeader("shop");
    renderFooter();

    function draw(){
      const ids = getWishlist();
      const items = PRODUCTS.filter(p => ids.includes(p.id));
      const grid = document.getElementById("wishGrid");
      const empty = document.getElementById("wishEmpty");
      if (!items.length){
        grid.style.display = "none";
        empty.style.display = "block";
        return;
      }
      grid.style.display = "";
      empty.style.display = "none";
      renderProductGrid(grid, items);
    }

    await PRODUCTS_READY;
    draw();
    document.addEventListener("shj:update", draw);
    refreshBadges();
  });
</script>
</body>
</html>
