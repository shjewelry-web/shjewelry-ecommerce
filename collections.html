<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collections — SH Jewelry</title>
<meta name="description" content="Browse SH Jewelry by collection — Bracelets, Earrings, Necklace and Jhumka.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="assets/images/favicon-512.jpg">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .collection-tile{
    position:relative; aspect-ratio:3/4; border-radius:var(--radius-m); overflow:hidden;
    border:1px solid var(--line); display:flex; align-items:flex-end;
  }
  .collection-tile img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:transform .7s var(--ease); }
  .collection-tile::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, transparent 40%, rgba(5,6,8,.92) 100%);
  }
  .collection-tile:hover img{ transform:scale(1.06); }
  .collection-tile .ct-body{ position:relative; z-index:1; padding:28px; width:100%; }
  .collection-tile h3{ font-size:1.5rem; }
  .collection-tile .ct-link{ margin-top:10px; display:inline-flex; gap:8px; align-items:center; font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold-soft); }
</style>
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<header id="site-header"></header>

<main id="main">
  <section class="page-banner">
    <div class="container pb-content">
      <div class="crumb"><a href="index.html">Home</a> / <span>Collections</span></div>
      <h1>Collections</h1>
      <p class="lede" style="margin-top:14px;">Explore our jewelry collections.</p>
    </div>
  </section>

  <section class="section" style="padding-top:0;">
    <div class="container">
      <div class="grid-4" id="collectionGrid"></div>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>

  <!-- Firebase compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="assets/js/sanity.js"></script>
<script src="assets/js/settings.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/components.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", async () => {
    renderHeader("collections");
    renderFooter();

    // name/desc stay editorial/hand-written; only the representative photo
    // is swapped for a live one from Sanity when that category has stock —
    // falls back to the original curated shot if it doesn't.
    const tiles = [
      { name: "Bracelets", img900: "assets/images/product-ruby-bangles-1100.jpg", img640: "assets/images/product-ruby-bangles-640.jpg", desc: "Bangles and stacking pieces." },
      { name: "Earrings", img900: "assets/images/collection-emerald-hoops-1100.jpg", img640: "assets/images/collection-emerald-hoops-640.jpg", desc: "Hoops, drops and chandeliers." },
      { name: "Necklace", img900: "assets/images/product-heart-necklace-900.jpg", img640: "assets/images/product-heart-necklace-520.jpg", desc: "Pendants and chains." },
      { name: "Jhumka", img900: "assets/images/product-silver-jhumka-900.jpg", img640: "assets/images/product-silver-jhumka-520.jpg", desc: "Traditional domed drop earrings." }
    ];

    await PRODUCTS_READY;
    for (const name of CATEGORIES) { if (!tiles.some(t => t.name === name)) tiles.push({name,desc:"Explore the collection."}); }
    tiles.forEach(t => {
      const live = PRODUCTS.find(p => p.category === t.name);
      if (live){
        t.img900 = productImage(live, 900);
        t.img640 = productImage(live, 520);
      }
    });

    document.getElementById("collectionGrid").innerHTML = tiles.map(t => `
      <a href="shop.html?category=${encodeURIComponent(t.name)}" class="collection-tile reveal">
        <img src="${escapeHtml(t.img900)}" srcset="${escapeHtml(t.img640)} 640w, ${escapeHtml(t.img900)} 1100w" sizes="(max-width:860px) 90vw, 30vw" alt="${escapeHtml(t.name)}" loading="lazy">
        <div class="ct-body">
          <h3>${escapeHtml(t.name)}</h3>
          <p class="text-secondary" style="font-size:.85rem; margin-top:4px;">${t.desc}</p>
          <span class="ct-link">Shop ${escapeHtml(t.name)} →</span>
        </div>
      </a>
    `).join("");

    initReveal();
    refreshBadges();
  });
</script>
</body>
</html>
