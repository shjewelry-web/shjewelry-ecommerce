<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account — SH Jewelry</title>
<meta name="description" content="Sign in to your SH Jewelry account.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="assets/images/favicon-512.jpg">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<header id="site-header"></header>

<main id="main">
  <section class="section" style="padding-top:calc(var(--header-h) + 60px); min-height:70vh; display:flex; align-items:center;">
    <div class="container-narrow" style="width:100%;">
      <div class="reveal" style="max-width:420px; margin:0 auto; text-align:center;">
        <h1>Sign In</h1>
        <p class="text-secondary" style="margin-top:10px;">Account features are coming soon — this is a preview of the sign-in screen.</p>
        <form id="acctForm" style="margin-top:36px; text-align:left;">
          <div class="form-group"><label for="acctEmail">Email</label><input type="email" id="acctEmail"></div>
          <div class="form-group"><label for="acctPass">Password</label><input type="text" id="acctPass"></div>
          <button type="submit" class="btn btn-primary btn-block" style="margin-top:10px;">Sign In</button>
        </form>
        <p id="acctNote" style="display:none; margin-top:20px; color:var(--gold-soft); font-size:.88rem;">Accounts aren't active yet — check back soon.</p>
        <p class="text-secondary" style="margin-top:28px; font-size:.88rem;">No account needed to shop — checkout works as a guest.</p>
      </div>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>

<script src="assets/js/sanity.js"></script>
<script src="assets/js/settings.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/components.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    renderHeader("");
    renderFooter();
    initReveal();
    refreshBadges();
    document.getElementById("acctForm").addEventListener("submit", (e) => {
      e.preventDefault();
      document.getElementById("acctNote").style.display = "block";
    });
  });
</script>
</body>
</html>
